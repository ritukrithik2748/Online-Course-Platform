<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LearNova — learn from world-class instructors with hands-on courses in development, design, data, business and more."
    />
    <meta name="theme-color" content="#d62976" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LearNova — Learn something worth sharing</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("coursehub.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (stored !== "light" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* theme falls back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
